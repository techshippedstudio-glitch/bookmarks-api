[project]
name = "bookmarks-api"
version = "0.1.0"
description = "A small bookmarks REST API built with GitHub Spec Kit, FastAPI and PostgreSQL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookmarks_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
