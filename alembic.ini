[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# The database URL comes from bookmarks_api.config (DATABASE_URL), unless overridden with
#   alembic -x url=postgresql://... upgrade head
# or by code that sets the sqlalchemy.url option (the test suite does this).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
